name: Netfilter recovery regression

on:
  push:
    paths:
      - 'src/backend-c/**'
      - '.github/workflows/check-netfilter.yml'
  pull_request:
    paths:
      - 'src/backend-c/**'
      - '.github/workflows/check-netfilter.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  recovery:
    name: Recovery (${{ matrix.frontend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        frontend: [legacy, nft]
    steps:
      - uses: actions/checkout@v5
      - name: Install build and network-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-dev libpcre2-dev libmnl-dev libcjson-dev libcurl4-openssl-dev iptables ipset
          sudo update-alternatives --set iptables /usr/sbin/iptables-${{ matrix.frontend }}
          sudo update-alternatives --set ip6tables /usr/sbin/ip6tables-${{ matrix.frontend }}
      - name: Build recovery tests with Keenetic code enabled
        id: build
        working-directory: src/backend-c
        run: make ENTWARE_KN=1 CFLAGS_EXTRA=-Werror build/host/tests/test_nfrebuild_recovery
      - name: Checked fake and deterministic fault injection
        if: steps.build.outcome == 'success'
        working-directory: src/backend-c
        run: |
          set -euo pipefail
          timeout 90s build/host/tests/test_nfrebuild_recovery -v 2>&1 | tee recovery-fake.log
      - name: Real kernel recovery in a disposable network namespace
        if: always() && steps.build.outcome == 'success'
        working-directory: src/backend-c
        run: |
          set -euo pipefail
          sudo env MT_TEST_REAL_IPTABLES=1 unshare --net \
            timeout 90s build/host/tests/test_nfrebuild_recovery -v 2>&1 | tee recovery-kernel.log
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netfilter-recovery-${{ matrix.frontend }}
          path: src/backend-c/recovery-*.log
          retention-days: 7
