stages:
  - test
  - build
  - release

variables:
  GIT_DEPTH: 0
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${CI_COMMIT_TAG}"

src_unchanged:
  stage: test
  image: busybox:1.37.0-uclibc
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
      changes:
        - src/backend-c/**/*
        - src/frontend/**/*
      when: never
    - if: '$CI_MERGE_REQUEST_ID'
  script:
    - echo "Bypassing \"Pipeline must successes\"..."

# Backend is C11 (src/backend-c/) since the Go rewrite completed in
# Phase 9 (docs/c-rewrite/decisions.md D-45); src/backend (Go) no longer
# exists. See .github/workflows/check-c.yml for the full build/test/
# sanitize/static_analysis/fuzz/differential matrix this mirrors.
test_backend:
  stage: test
  image: alpine:3.21
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_MERGE_REQUEST_ID'
      changes:
        - src/backend-c/**/*
  script:
    - apk add --no-cache build-base yaml-dev pcre2-dev libmnl-dev curl-dev cjson-dev
    - cd ./src/backend-c
    - make CFLAGS_EXTRA=-Werror
    - make test

test_frontend:
  stage: test
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  variables:
    GIT_DEPTH: "1"
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
    DENO_DIR: "$CI_PROJECT_DIR/.deno"
  cache:
    key:
      files:
        - src/frontend/package-lock.json
        - src/frontend/deno.json
    paths:
      - .npm/
      - .deno/
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_MERGE_REQUEST_ID'
      changes:
        - src/frontend/**/*
  before_script:
    - apt-get update
    - apt-get install -y unzip ca-certificates
  script:
    - export PATH="$HOME/.deno/bin:$PATH"
    - curl -fsSL https://deno.land/install.sh | sh
    - cd ./src/frontend
    - npm ci --prefer-offline
    - npm run test:unit
    - npm run test:e2e

build:
  stage: build
  image: alpine:3.21
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(develop|main)$/'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_MERGE_REQUEST_ID'
      when: manual
      allow_failure: true
  before_script:
    - apk add nodejs npm git make fakeroot tar findutils openssl
    - apk add build-base yaml-dev pcre2-dev libmnl-dev curl-dev cjson-dev
    - apk add upx --repository=http://dl-cdn.alpinelinux.org/alpine/v3.21/main # Downloading of upx-4.2.4-r0
    - apk add apk-tools libapk --repository=http://dl-cdn.alpinelinux.org/alpine/v3.23/main # Downloading of apk-tools-3.0.5-r0
  script:
    # No real per-target Entware/OpenWrt cross-toolchain + feed sysroot
    # (libyaml/cJSON/PCRE2/libmnl/libcurl built for that target's libc)
    # is provisioned here -- see docs/c-rewrite/toolchains.md and
    # decisions.md D-45. Go used to cross-compile every target
    # automatically via GOOS/GOARCH; C has no such fallback, so building
    # without a real CROSS_COMPILE/SYSROOT would silently produce a
    # host-x86_64 binary mislabeled as the target's architecture. Skip
    # (not silently mis-build) any target lacking one, same gate as
    # .github/workflows/build.yml.
    - eval export $(make _return_export_dynamic_env);
      for config in config/*/*.config; do
        cp "${config}" .config;
        . ./.config;
        if [ -z "${CROSS_COMPILE:-}" ]; then
          echo "SKIP ${config} -- no CROSS_COMPILE/SYSROOT provisioned for PLATFORM=$PLATFORM TARGET=$TARGET, see decisions.md D-45";
          continue;
        fi;
        make;
      done
  artifacts:
    paths:
      - .build/*.ipk
      - .build/*.apk
    expire_in: 1 week

upload:
  stage: release
  needs: ["build"]
  image: curlimages/curl:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      ASSETS_LINKS=""
      for file in $(find .build \( -name '*.ipk' -o -name '*.apk' \)); do
        name=$(basename "${file}")
        url="${PACKAGE_REGISTRY_URL}/${name}"
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "${file}" "${url}"
        ASSETS_LINKS="$ASSETS_LINKS --assets-link {\"name\":\"${name}\",\"url\":\"${url}\"}"
      done
      
      escaped_ASSETS_LINKS="${ASSETS_LINKS//\\/\\\\}"
      escaped_ASSETS_LINKS="${escaped_ASSETS_LINKS//\"/\\\"}"
      echo "ASSETS_LINKS=\"${escaped_ASSETS_LINKS}\"" > .env
  artifacts:
    paths:
      - .env
    expire_in: 1 hour

release:
  stage: release
  needs: ["upload"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      source .env
      release-cli create --name "${CI_COMMIT_TAG}" --tag-name "${CI_COMMIT_TAG}" ${ASSETS_LINKS}
