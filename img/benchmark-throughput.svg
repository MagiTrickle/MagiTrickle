    <text x="132" y="489">10k</text>
    <text x="132" y="422">20k</text>
    <text x="132" y="356">30k</text>
    <text x="132" y="289">40k</text>
    <text x="132" y="223">50k</text>
  </g>

  <g class="tick" text-anchor="middle">
    <text x="250" y="583">100</text>
    <text x="635" y="583">1 000</text>
    <text x="1020" y="583">10 000</text>
  </g>

  <text class="axis-label" x="635" y="625" text-anchor="middle">Количество правил</text>
  <text class="axis-label" transform="translate(56 384) rotate(-90)" text-anchor="middle">Запросов в секунду</text>

  <path d="M250 279 L635 275 L1020 286" fill="none" stroke="#4f73c6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M250 408 L635 412 L1020 467" fill="none" stroke="#c8d9fa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#4f73c6">
    <circle cx="250" cy="279" r="9"/>
    <circle cx="635" cy="275" r="9"/>
    <circle cx="1020" cy="286" r="9"/>
  </g>
  <g fill="#c8d9fa">
    <circle cx="250" cy="408" r="9"/>
    <circle cx="635" cy="412" r="9"/>
    <circle cx="1020" cy="467" r="9"/>
  </g>

  <g class="value" text-anchor="middle">
