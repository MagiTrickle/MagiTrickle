<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Пропускная способность Go MagiTrickle и mt-c</title>
  <desc id="desc">Медиана RPS при 100, 1000 и 10000 namespace-правил. mt-c: 40820, 41418, 39746. Go: 21312, 20811, 12497.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #424750;
      --muted: #6b7280;
      --axis: #59606b;
      --grid: #e7e7e7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #c9cdd3;
        --muted: #a6abb3;
        --axis: #b5bac2;
        --grid: #383838;
      }
    }
    text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--ink); }
    .subtitle { font-size: 17px; fill: var(--muted); }
    .axis-label { font-size: 17px; font-weight: 600; }
    .tick { font-size: 15px; fill: var(--muted); }
    .legend { font-size: 18px; font-weight: 600; }
    .value { font-size: 15px; font-weight: 700; }
    .note { font-size: 14px; fill: var(--muted); }
    .axis { stroke: var(--axis); }
    .grid { stroke: var(--grid); }
  </style>

  <text class="subtitle" x="76" y="68">Полный DNS-пайплайн · namespace match · UDP · 10 клиентов · медиана 3 прогонов</text>

  <circle cx="80" cy="116" r="7" fill="#4f73c6"/>
  <text class="legend" x="97" y="122">mt-c</text>
  <circle cx="182" cy="116" r="7" fill="#c8d9fa"/>
  <text class="legend" x="199" y="122">Go MagiTrickle</text>

  <line class="axis" x1="150" y1="218" x2="150" y2="550" stroke-width="2"/>
  <line class="axis" x1="150" y1="550" x2="1120" y2="550" stroke-width="2"/>

  <g class="grid" stroke-width="1">
    <line x1="150" y1="484" x2="1120" y2="484"/>
    <line x1="150" y1="417" x2="1120" y2="417"/>
    <line x1="150" y1="351" x2="1120" y2="351"/>
    <line x1="150" y1="284" x2="1120" y2="284"/>
    <line x1="150" y1="218" x2="1120" y2="218"/>
  </g>

  <g class="tick" text-anchor="end">
