    <mask id="crownGlintMask" maskUnits="userSpaceOnUse"><rect width="1254" height="1254" fill="url(#crownGlintFade)"/></mask>
    <mask id="rimFadeMask" maskUnits="userSpaceOnUse"><rect width="1254" height="1254" fill="url(#rimFade)"/></mask>
    <mask id="lowerBandMask" maskUnits="userSpaceOnUse"><rect width="1254" height="1254" fill="url(#lowerBandFade)"/></mask>
