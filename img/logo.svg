    <path d="M 219,780 C 260,638 366,524 517,408 C 658,291 776,258 943,319 C 1012,335 1047,380 1082,351" fill="none" stroke="#f1ffff" stroke-linecap="round" stroke-width="1.65" opacity=".77"/>
