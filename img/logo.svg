    <path d="M 273,1040 C 187,965 172,868 205,764 C 249,593 364,426 514,293 C 673,153 813,121 914,138 C 997,138 1061,178 1087,246 C 1102,280 1108,325 1082,351 C 1047,380 1012,335 943,319 C 776,258 658,291 517,408 C 366,524 260,638 219,780 C 187,888 210,977 273,1040 Z" fill="url(#upperFace)" mask="url(#rimFadeMask)"/>
