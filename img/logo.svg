      <stop offset=".26" stop-color="#249bf9"/>
      <stop offset=".55" stop-color="#198cf9"/>
      <stop offset="1" stop-color="#9dcbff"/>
    </linearGradient>
    <linearGradient id="crown" x1="224" y1="318" x2="822" y2="120" gradientUnits="userSpaceOnUse">
