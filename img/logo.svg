    <radialGradient id="innerLight" gradientUnits="userSpaceOnUse" cx="707" cy="942" r="463">
      <stop stop-color="#d9fdff" stop-opacity=".21"/>
      <stop offset=".62" stop-color="#92e0ff" stop-opacity=".07"/>
