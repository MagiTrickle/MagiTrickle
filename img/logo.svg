    <path d="M 238,891 C 365,1007 512,1046 655,1042 C 844,1043 1009,987 1096,864 C 1139,882 1161,912 1125,968 C 1048,1078 913,1153 763,1173 C 560,1152 361,1068 238,891 Z" fill="url(#lowerFace)"/>
