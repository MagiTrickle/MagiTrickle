<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Glossy Cyan C Code Logo</title>
  <desc id="desc">A vector cyan-blue satin ribbon in the shape of a C, surrounding a rounded code bracket, slash and two circles. Smooth gradient highlights, transparent background.</desc>
  <defs>
    <linearGradient id="body" x1="141" y1="440" x2="1074" y2="872" gradientUnits="userSpaceOnUse">
