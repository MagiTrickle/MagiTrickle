configVersion: 0.99.0
app:
  httpWeb:
    enabled: true
    auth:
      enabled: false
    host:
      address: '[::]'
      port: 8080
    skin: default
  dnsProxy:
    host:
      address: '[::]'
      port: 3553
    upstream:
      address: 127.0.0.1
      port: 53
    disableRemap53: false
    disableFakePTR: false
    disableDropAAAA: false
    maxIdleConns: 10
    maxConcurrent: 100
    timeout: 5s
  netfilter:
    iptables:
      chainPrefix: MT_
    ipset:
      tablePrefix: mt_
      additionalTTL: 1h0m0s
    disableIPv4: false
    disableIPv6: false
    startMarkTableIndex: 1298229097
  link:
  - br0
  showAllInterfaces: false
  logLevel: info
groups:
- id: 0a0b0c0d
  name: "123"
  color: '#ffffff'
  interface: "y"
  enable: true
  rules:
  - id: "01020304"
    name: 'has: colon'
    type: domain
    rule: "true"
    enable: true
  - id: "01020305"
    name: ' leading space'
    type: domain
    rule: "12:30:45"
    enable: false
  - id: "01020306"
    name: |-
      line1
      line2
    type: wildcard
    rule: '*star'
    enable: true
  - id: "01020307"
    name: "null"
    type: domain
    rule: -dash
    enable: true
subscriptions: []
