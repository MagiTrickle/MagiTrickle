definitions:
  types.ErrorRes:
    properties:
      error:
        example: something went wrong
        type: string
    type: object
  types.GroupReq:
    properties:
      color:
        example: '#ffffff'
        type: string
      enable:
        example: true
        type: boolean
      id:
        example: 0a1b2c3d
        type: string
      interface:
        example: nwg0
        type: string
      name:
        example: Routing
        type: string
      priority:
        description: Higher values take precedence when routing. Omission uses 300 for a new group and preserves the current value when updating an existing group.
        type: integer
        minimum: 1
        maximum: 999
        default: 300
        example: 300
      rules:
        items:
          $ref: '#/definitions/types.RuleReq'
        type: array
    type: object
  types.GroupRes:
    properties:
      color:
        example: '#ffffff'
        type: string
      enable:
        example: true
        type: boolean
      id:
        example: 0a1b2c3d
        type: string
      interface:
        example: nwg0
        type: string
      name:
        example: Routing
        type: string
      priority:
        description: Routing priority; higher values take precedence.
        type: integer
        minimum: 1
        maximum: 999
        example: 300
      rules:
        items:
          $ref: '#/definitions/types.RuleRes'
        type: array
    type: object
  types.GroupsReq:
    properties:
      groups:
        items:
          $ref: '#/definitions/types.GroupReq'
        type: array
    type: object
  types.GroupsRes:
    properties:
      groups:
        items:
          $ref: '#/definitions/types.GroupRes'
        type: array
    type: object
  types.InterfaceRes:
    properties:
      id:
        example: nwg0
        type: string
    type: object
  types.InterfacesRes:
    properties:
      interfaces:
        items:
          $ref: '#/definitions/types.InterfaceRes'
        type: array
    type: object
  types.NetfilterDHookReq:
    properties:
      table:
        example: nat
        type: string
      type:
        example: iptables
        type: string
    type: object
  types.UpdateInfoRes:
    type: object
    required: [installed_version, installed_revision, asset_suffix, can_install, reason]
    properties:
      installed_version: {type: string, example: '0.8.2.2'}
      installed_revision: {type: integer, minimum: 1, example: 1}
      asset_suffix: {type: string, example: entware_aarch64-3.10_kn.ipk}
      can_install: {type: boolean}
      reason: {type: string}
  types.UpdateInstallReq:
    type: object
    additionalProperties: false
    required: [tag, release_id, preview]
    properties:
      tag: {type: string, example: '0.8.3'}
      release_id: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
      preview: {type: boolean}
  types.UpdateAcceptedRes:
    type: object
    required: [job_id, stage]
    properties:
      job_id:
        type: string
        pattern: '^[0-9a-f]{32}$'
      stage:
        type: string
        enum: [queued]
  types.UpdateStatusRes:
    type: object
    required: [stage]
    properties:
      stage:
        type: string
        enum: [idle, queued, checking, downloading, verifying, backing_up, installing, restarting, succeeded, failed, interrupted]
      job_id:
        type: string
        pattern: '^[0-9a-f]{32}$'
      tag: {type: string}
      previous_version: {type: string}
      target_version: {type: string}
      target_revision: {type: integer}
      package_size: {type: integer}
      backup_path: {type: string}
      error: {type: string}
      started_at: {type: integer}
      finished_at: {type: integer}
      package_installed: {type: boolean}
  types.RuleReq:
    properties:
      enable:
        example: true
        type: boolean
      id:
        example: 0a1b2c3d
        type: string
      name:
        example: Example Domain
        type: string
      rule:
        example: example.com
        type: string
      type:
        example: domain
        type: string
    type: object
  types.RuleRes:
    properties:
      enable:
        example: true
        type: boolean
      id:
        example: 0a1b2c3d
        type: string
      name:
        example: Example Domain
        type: string
      rule:
        example: example.com
        type: string
      type:
        example: domain
        type: string
    type: object
  types.RulesRes:
    properties:
      rules:
        items:
          $ref: '#/definitions/types.RuleRes'
        type: array
    type: object
info:
  contact: {}
  description: >-
    Groups and subscriptions accept and return priority, an integer from 1 to
    999 inclusive. Higher values take precedence when routing. A newly created
    group defaults to 300, and a subscription to 100. Omitting priority when
    updating an existing object preserves its current value. Explicit null,
    nonnumeric, fractional, duplicate or out-of-range priorities return HTTP 400
    before applying the request. The same defaults apply when loading a legacy
    YAML configuration without priority fields.
  title: MagiTrickle API
  version: "0.1"
paths:
