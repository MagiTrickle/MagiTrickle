  /api/v1/system/update/install:
    post:
      summary: Queue a root-authorized GitHub release installation
      description: >-
        Requires a verified root JWT on HTTP and Unix transports, even if
        general WebUI authentication is disabled. Revalidates the official
        release and device package. HTTP 202 means queued, not installed (D-74).
      consumes:
      - application/json
      parameters:
      - in: body
        name: json
        required: true
        schema:
          $ref: '#/definitions/types.UpdateInstallReq'
      produces:
      - application/json
      responses:
        "202":
          description: Worker exec confirmed; job queued
          schema:
            $ref: '#/definitions/types.UpdateAcceptedRes'
        "400":
          description: Error
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "401":
